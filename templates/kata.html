<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <title>{{ kata.title }} – KATAlog</title>
</head>
<body>
  <h1>{{ kata.title }}</h1>
  <p style="white-space: pre-wrap">{{ kata.description }}</p>
  <p>Lisääjä: {{ kata.username }}</p>
  {% if session.user_id == kata.user_id %}
  <p><a href="{{ url_for('edit_kata', kata_id=kata.id) }}">Muokkaa kataa</a></p>
  <form action="{{ url_for('remove_kata', kata_id=kata.id) }}" method="post">
    <input type="submit" value="Poista kata" />
  </form>
  {% endif %}
  <p><a href="/">Takaisin etusivulle</a></p>
</body>
</html>
