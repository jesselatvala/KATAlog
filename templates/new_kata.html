<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <title>Lisää kata</title>
</head>
<body>
    {% if session.user_id %}
  <p>Olet kirjautunut nimellä {{ session.username }}</p>
  {% else %}
  <p>Et ole kirjautunut sisään. <a href="/login">Kirjaudu sisään</a></p>
  {% endif %}
  <h1>Lisää kata</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form action="/create_kata" method="post">
    <p>
      <label for="title">Nimi:</label><br />
      <input id="title" name="title" value="{{ title or '' }}" maxlength="50" required />
    </p>
    <p>
      <label for="description">Kuvaus:</label><br />
      <textarea id="description" name="description" rows="8" cols="50"
                maxlength="500" required>{{ description or '' }}</textarea>
    </p>
      <p>
      <label for="developer">Katan kehittäjä:</label><br />
      <input id="developer" name="developer" value="{{ developer or '' }}" />
    </p>
    <p>
      <label for="style">Tyylisuunta:</label><br />
      <input id="style" name="style" value="{{ style or '' }}" />
    </p>
    <p>
      <label for="techniques">Tekniikkalista (yksi tekniikka riville):</label><br />
      <textarea id="techniques" name="techniques" rows="8" cols="50">{{ techniques or '' }}</textarea>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Lisää kata" />
  </form>
  <p><a href="/">Takaisin etusivulle</a></p>
</body>
</html>
